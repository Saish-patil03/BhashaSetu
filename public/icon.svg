<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="karnataka" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D60000"/>
      <stop offset="50%" stop-color="#D60000"/>
      <stop offset="50%" stop-color="#FFD100"/>
      <stop offset="100%" stop-color="#FFD100"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#karnataka)"/>
  <rect x="32" y="32" width="448" height="448" rx="84" fill="rgba(24, 24, 27, 0.88)" filter="url(#shadow)"/>
  <!-- Kannada Letter "ಭಾ" -->
  <text x="256" y="340" font-size="280" font-weight="800" text-anchor="middle" fill="#FFD100" font-family="'Noto Sans Kannada', sans-serif">ಭಾ</text>
</svg>
